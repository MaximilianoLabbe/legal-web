  <rect x="310" y="330" width="390" height="185" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="338" y="372" fill="#166534" font-size="19" font-family="Arial" font-weight="700">Trabajo asignado</text>
  <text x="338" y="411" fill="#334155" font-size="16" font-family="Arial">Clientes y casos asociados a su cuenta.</text>
  <text x="338" y="444" fill="#334155" font-size="16" font-family="Arial">Tareas que debe completar y su calendario.</text>
  <text x="338" y="481" fill="#64748b" font-size="14" font-family="Arial">Los datos se limitan según los permisos del sistema.</text>
  <rect x="724" y="330" width="402" height="185" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="752" y="372" fill="#9a3412" font-size="19" font-family="Arial" font-weight="700">No disponibles para este perfil</text>
  <text x="752" y="416" fill="#334155" font-size="16" font-family="Arial">Contratos y pagos</text>
  <text x="752" y="451" fill="#334155" font-size="16" font-family="Arial">Administración de usuarios</text>
  <text x="752" y="486" fill="#64748b" font-size="14" font-family="Arial">Solicite acceso al administrador si lo necesita.</text>
