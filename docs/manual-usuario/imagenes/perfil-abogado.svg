  <title id="title">Perfil Abogado</title>
  <desc id="desc">Ilustración del menú y permisos disponibles para un abogado.</desc>
  <rect width="1200" height="620" rx="24" fill="#eef2f7"/>
  <rect x="28" y="28" width="1144" height="564" rx="18" fill="#fff" stroke="#d7dee8"/>
  <rect x="28" y="28" width="246" height="564" rx="18" fill="#1f2937"/>
  <circle cx="61" cy="67" r="8" fill="#fb7185"/><circle cx="87" cy="67" r="8" fill="#fbbf24"/><circle cx="113" cy="67" r="8" fill="#34d399"/>
  <text x="50" y="117" fill="#fff" font-size="21" font-family="Arial" font-weight="700">FGN Abogados</text>
  <rect x="46" y="143" width="210" height="40" rx="9" fill="#374151"/><text x="63" y="169" fill="#fff" font-size="15" font-family="Arial">Panel de control</text>
  <text x="63" y="218" fill="#d1d5db" font-size="15" font-family="Arial">Clientes</text>
  <text x="63" y="260" fill="#d1d5db" font-size="15" font-family="Arial">Casos</text>
  <text x="63" y="302" fill="#d1d5db" font-size="15" font-family="Arial">Tareas</text>
  <text x="51" y="548" fill="#fff" font-size="14" font-family="Arial">Abogado</text>
  <text x="310" y="91" fill="#111827" font-size="28" font-family="Arial" font-weight="700">Perfil Abogado</text>
  <text x="310" y="123" fill="#64748b" font-size="16" font-family="Arial">Herramientas para organizar y dar seguimiento a sus asuntos</text>
  <rect x="310" y="157" width="816" height="149" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="338" y="197" fill="#1e3a8a" font-size="19" font-family="Arial" font-weight="700">Módulos disponibles</text>
  <rect x="338" y="220" width="167" height="48" rx="10" fill="#fff" stroke="#dbeafe"/><text x="357" y="250" fill="#334155" font-size="15" font-family="Arial">Panel</text>
  <rect x="520" y="220" width="167" height="48" rx="10" fill="#fff" stroke="#dbeafe"/><text x="539" y="250" fill="#334155" font-size="15" font-family="Arial">Clientes</text>
  <rect x="702" y="220" width="167" height="48" rx="10" fill="#fff" stroke="#dbeafe"/><text x="721" y="250" fill="#334155" font-size="15" font-family="Arial">Casos</text>
