<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Documentos de un caso</title><desc id="desc">Panel ilustrativo para cargar y gestionar documentos de un caso.</desc>
  <rect width="1200" height="620" rx="24" fill="#eef2f7"/><rect x="55" y="38" width="1090" height="544" rx="18" fill="#fff" stroke="#d7dee8"/>
  <text x="91" y="96" fill="#64748b" font-size="14" font-family="Arial">Casos / Asunto de ejemplo</text><text x="91" y="138" fill="#111827" font-size="26" font-family="Arial" font-weight="700">Documentos del caso</text><text x="91" y="168" fill="#64748b" font-size="14" font-family="Arial">Archivos asociados al expediente</text>
  <rect x="827" y="107" width="278" height="48" rx="9" fill="#2563eb"/><text x="889" y="137" fill="#fff" font-size="15" font-family="Arial" font-weight="700">Subir documento</text>
  <rect x="91" y="200" width="1014" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="118" y="233" fill="#1e3a8a" font-size="15" font-family="Arial" font-weight="700">Carga de archivo</text><text x="118" y="255" fill="#475569" font-size="13" font-family="Arial">Máximo 10 MB · categoría y descripción opcionales</text>
  <rect x="91" y="294" width="1014" height="67" rx="9" fill="#fff" stroke="#e2e8f0"/><rect x="112" y="310" width="36" height="36" rx="8" fill="#fee2e2"/><text x="124" y="334" fill="#b91c1c" font-size="12" font-family="Arial" font-weight="700">PDF</text><text x="166" y="321" fill="#111827" font-size="14" font-family="Arial" font-weight="700">documento_ejemplo.pdf</text><text x="166" y="343" fill="#64748b" font-size="12" font-family="Arial">Escrito · archivo ilustrativo</text><text x="854" y="333" fill="#2563eb" font-size="13" font-family="Arial">Visualizar</text><text x="951" y="333" fill="#2563eb" font-size="13" font-family="Arial">Descargar</text><text x="1050" y="333" fill="#b91c1c" font-size="13" font-family="Arial">Eliminar</text>
  <rect x="91" y="373" width="1014" height="67" rx="9" fill="#fff" stroke="#e2e8f0"/><rect x="112" y="389" width="36" height="36" rx="8" fill="#dbeafe"/><text x="124" y="413" fill="#1d4ed8" font-size="12" font-family="Arial" font-weight="700">DOC</text><text x="166" y="400" fill="#111827" font-size="14" font-family="Arial" font-weight="700">antecedentes_ejemplo.docx</text><text x="166" y="422" fill="#64748b" font-size="12" font-family="Arial">Antecedente · archivo ilustrativo</text><text x="854" y="412" fill="#2563eb" font-size="13" font-family="Arial">Visualizar</text><text x="951" y="412" fill="#2563eb" font-size="13" font-family="Arial">Descargar</text><text x="1050" y="412" fill="#b91c1c" font-size="13" font-family="Arial">Eliminar</text>
  <text x="91" y="492" fill="#64748b" font-size="13" font-family="Arial">Confirme el caso correcto antes de subir o eliminar un archivo.</text>
